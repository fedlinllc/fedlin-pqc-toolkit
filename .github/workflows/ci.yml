# CI for fedlin-pqc-toolkit. Event-driven only (push, pull request); no schedule.
# Actions are pinned by commit SHA; the Gitleaks image is pinned by digest (same digest as the
# canonical repo's pre-receive hook). The unit tests use only the Python standard library and run
# offline, including the vendored PKI Consortium CBOM validator (third_party/pkic-cbom).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Unit + PKIC conformance tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]   # 3.9 = the UBI 9 image's runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -I -m unittest discover -s tests -v
  secrets:
    name: Secret scan (Gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            docker.io/zricethezav/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source=/repo --exit-code=1 --ignore-gitleaks-allow --redact
