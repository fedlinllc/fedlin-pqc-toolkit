# Developer Certificate of Origin: every commit in a pull request carries a Signed-off-by line for its
# author's email. Event-driven (pull request only); read-only token; no third-party actions beyond the
# pinned checkout.
name: dco
on:
  pull_request:
permissions:
  contents: read
jobs:
  signoff:
    name: Signed-off-by on every commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$email>"; then
              echo "ok   $c"
            else
              echo "MISSING Signed-off-by for $email on $c"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Add a sign-off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
