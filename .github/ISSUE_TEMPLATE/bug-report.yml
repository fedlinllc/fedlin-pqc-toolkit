name: Bug report
description: Something does not work, crashes, or records a wrong fact.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste unredacted CBOMs, reports or logs.** They can contain internal hostnames, addresses and certificate subjects. Use `--redact old=new`, or trim to the lines that show the problem.
        Security vulnerabilities go to the private **Report a vulnerability** form (see SECURITY.md), never here.
  - type: input
    id: version
    attributes:
      label: Toolkit version
      description: From `scripts/tier2_pipeline.py --version`, or the image tag or digest.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, with hostnames and paths replaced if needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Error output or the wrong result (redacted).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. RHEL 9.6 FIPS mode, Python 3.9, podman 5; or container image
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed or redacted hostnames, addresses and other sensitive data from everything above.
          required: true
